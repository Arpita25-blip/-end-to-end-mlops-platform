apiVersion: apps/v1
kind: Deployment
metadata:
  name: e2e-mlops-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: e2e-mlops-platform
  template:
    metadata:
      labels:
        app: e2e-mlops-platform
    spec:
      containers:
      - name: e2e-mlops-platform
        image: arpitajagadale/e2e-mlops-platform:latest
        ports:
        - containerPort: 8000